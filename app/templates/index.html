<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Mac Stream</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #screen {
      max-width: 100%; max-height: 100%;
      width: 100%; height: 100%;
      object-fit: contain;            /* keep aspect ratio, no crop */
      display: block;
    }
    #status {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #888; font-size: 16px; letter-spacing: .5px;
      pointer-events: none; transition: opacity .4s;
    }
    #ui {
      position: fixed; bottom: 16px; right: 16px;
      display: flex; gap: 10px;
      opacity: 0.85; transition: opacity .3s;
    }
    #ui.hidden { opacity: 0; pointer-events: none; }
    button {
      background: rgba(30,30,30,.85); color: #eee;
      border: 1px solid #444; border-radius: 10px;
      padding: 12px 16px; font-size: 15px;
      backdrop-filter: blur(8px); cursor: pointer;
    }
    button:active { background: rgba(60,60,60,.9); }
  </style>
</head>
<body>
  <div id="stage">
    <img id="screen" alt="" />
    <div id="status">Connecting to Mac…</div>
  </div>

  <div id="ui">
    <button id="fsBtn">⛶ Fullscreen</button>
  </div>

  <script>
    const img    = document.getElementById('screen');
    const status = document.getElementById('status');
    const ui     = document.getElementById('ui');
    const fsBtn  = document.getElementById('fsBtn');

    // Cache-bust so a reconnect doesn't reuse a dead stream.
    function streamUrl() { return '/stream?t=' + Date.now(); }

    function connect() {
      status.style.opacity = '1';
      status.textContent = 'Connecting to Mac…';
      img.src = streamUrl();
    }

    img.addEventListener('load', () => { status.style.opacity = '0'; });

    // MJPEG <img> fires 'error' on disconnect / network drop -> retry.
    img.addEventListener('error', () => {
      status.style.opacity = '1';
      status.textContent = 'Reconnecting…';
      setTimeout(connect, 1500);
    });

    // -- Fullscreen -------------------------------------------------------
    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }
    function enterFullscreen() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) fn.call(el).catch(() => {});
    }
    function exitFullscreen() {
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) fn.call(document).catch(() => {});
    }
    fsBtn.addEventListener('click', () => {
      if (isFullscreen()) exitFullscreen(); else enterFullscreen();
    });

    // Auto-hide controls after inactivity for an immersive monitor feel.
    let hideTimer;
    function pokeUI() {
      ui.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => ui.classList.add('hidden'), 3000);
    }
    ['mousemove', 'touchstart', 'click'].forEach(ev =>
      document.addEventListener(ev, pokeUI, { passive: true })
    );

    // Keep the screen awake while streaming (best-effort).
    async function keepAwake() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (_) {}
    }

    connect();
    pokeUI();
    keepAwake();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) keepAwake();
    });
  </script>
</body>
</html>
