<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Ghost Monitor</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000; overflow: hidden;
      font-family: -apple-system, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #screen {
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
    }
    #status {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #888; font-size: 16px; letter-spacing: .5px;
      pointer-events: none; transition: opacity .4s;
    }
    #ui {
      position: fixed; bottom: 16px; right: 16px;
      display: flex; gap: 10px;
      opacity: 0.85; transition: opacity .3s;
    }
    #ui.hidden { opacity: 0; pointer-events: none; }
    button {
      background: rgba(30,30,30,.85); color: #eee;
      border: 1px solid #444; border-radius: 10px;
      padding: 12px 16px; font-size: 15px;
      backdrop-filter: blur(8px); cursor: pointer;
    }
    button:active { background: rgba(60,60,60,.9); }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="screen"></canvas>
    <div id="status">Connecting to Mac…</div>
  </div>

  <div id="ui">
    <button id="fsBtn">⛶ Fullscreen</button>
  </div>

  <script>
    const canvas = document.getElementById('screen');
    const ctx    = canvas.getContext('2d', { alpha: false, desynchronized: true });
    const status = document.getElementById('status');
    const ui     = document.getElementById('ui');
    const fsBtn  = document.getElementById('fsBtn');

    // Size the canvas to the device pixels of the viewport.
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width  = Math.round(window.innerWidth  * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Draw a frame letterboxed (object-fit: contain) into the canvas.
    function drawFit(bmp) {
      const cw = canvas.width, ch = canvas.height;
      const scale = Math.min(cw / bmp.width, ch / bmp.height);
      const w = bmp.width * scale, h = bmp.height * scale;
      const x = (cw - w) / 2, y = (ch - h) / 2;
      if (x > 0 || y > 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch); }
      ctx.drawImage(bmp, x, y, w, h);
    }

    // -- WebSocket: client-paced newest-frame delivery -------------------
    let ws = null;
    let rendering = false;

    function connect() {
      status.style.opacity = '1';
      status.textContent = 'Connecting to Mac…';
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.binaryType = 'arraybuffer';

      ws.onmessage = async (ev) => {
        // Empty keepalive (static screen): ack immediately, nothing to draw.
        if (!ev.data || ev.data.byteLength === 0) { ack(); return; }
        // Drop frames if we somehow fall behind a render.
        if (rendering) { ack(); return; }
        rendering = true;
        try {
          const bmp = await createImageBitmap(new Blob([ev.data], { type: 'image/jpeg' }));
          drawFit(bmp);
          bmp.close();
          status.style.opacity = '0';
        } catch (_) { /* skip bad frame */ }
        rendering = false;
        ack();                      // request the next (newest) frame
      };

      ws.onclose = () => {
        status.style.opacity = '1';
        status.textContent = 'Reconnecting…';
        setTimeout(connect, 1200);
      };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }

    function ack() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('n');
    }

    // -- Fullscreen -------------------------------------------------------
    function isFullscreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }
    function enterFullscreen() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) fn.call(el).catch(() => {});
    }
    function exitFullscreen() {
      const fn = document.exitFullscreen || document.webkitExitFullscreen;
      if (fn) fn.call(document).catch(() => {});
    }
    fsBtn.addEventListener('click', () => {
      if (isFullscreen()) exitFullscreen(); else enterFullscreen();
    });

    // Auto-hide controls after inactivity for an immersive monitor feel.
    let hideTimer;
    function pokeUI() {
      ui.classList.remove('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => ui.classList.add('hidden'), 3000);
    }
    ['mousemove', 'touchstart', 'click'].forEach(ev =>
      document.addEventListener(ev, pokeUI, { passive: true })
    );

    // Keep the screen awake while streaming (best-effort).
    async function keepAwake() {
      try {
        if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
      } catch (_) {}
    }

    connect();
    pokeUI();
    keepAwake();
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) keepAwake();
    });
  </script>
</body>
</html>
